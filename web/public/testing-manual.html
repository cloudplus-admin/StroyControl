<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StroyControl - приемка MVP</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#17211d;background:#eef3f0;accent-color:#1e7659}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}header,section{background:#fff;border:1px solid #d8e5de;border-radius:16px;padding:20px;margin-bottom:14px}header{background:#123f32;color:#fff}h1{margin:0 0 8px;font-size:27px}h2{font-size:19px;color:#124b3a}.roles,.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.roles div{background:#ffffff18;border-radius:10px;padding:11px}label{display:flex;gap:10px;padding:8px;line-height:1.4}input[type=checkbox]{width:20px;height:20px;flex:none}input[type=text],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid #ccd9d2;border-radius:9px;font:inherit}textarea{min-height:90px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar{height:10px;background:#ffffff33;border-radius:9px;flex:1;min-width:150px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#69d19f}button,a{padding:10px 14px;border:0;border-radius:9px;background:#daf3e7;color:#124b3a;font-weight:700;text-decoration:none;cursor:pointer}@media(max-width:650px){.roles,.meta{grid-template-columns:1fr}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}header{background:#fff;color:#17211d}.toolbar button,.toolbar a{display:none}}
  </style>
</head>
<body><main class="wrap">
  <header><h1>StroyControl - приемка MVP</h1><p>Чек-лист сохраняется локально в этом браузере.</p><div class="roles"><div><b>Прораб</b><br>111 / 111</div><div><b>Технадзор</b><br>222 / 222</div><div><b>Заказчик</b><br>333 / 333</div></div><div class="toolbar"><b id="count">0 / 0</b><span class="bar"><i id="bar"></i></span><a href="/" target="_blank">Открыть stage</a><button onclick="window.print()">Печать / PDF</button><button id="reset">Сбросить</button></div></header>
  <div id="checks"></div>
  <section><h2>Итог</h2><div class="meta"><input id="date" type="date" aria-label="Дата"><input id="tester" type="text" placeholder="Тестировщик"><select id="result"><option value="">Выбери итог</option><option value="passed">Принято</option><option value="failed">Не принято</option></select></div><p><textarea id="notes" placeholder="Замечания и номера дефектов"></textarea></p></section>
</main><script>
const groups={"Базовая проверка":["Stage открывается без ошибок","Вход 111, 222 и 333 успешен","Неверный пароль возвращает понятную ошибку","Все доступные роли и разделы соответствуют матрице доступа","Переключение RU / UZ работает","Мобильная верстка 390 x 844 не имеет горизонтальной прокрутки"],"Телефон -> API -> web":["Установлен свежий APK из текущего main","На телефоне выбран реальный объект stage","Создана запись каждого из 9 типов","Фото загрузилось и открывается в web","Запись, созданная offline, появилась после reconnect","Повторная синхронизация не создала дубликаты","Данные видны разрешенным ролям и скрыты от остальных"],"Web и API":["Health API: база и хранилище в статусе ok","Объекты, график, задачи и уведомления загружаются","Документы, акты и фотоотчеты загружаются","Дефекты и точки съемки загружаются","Нет ошибок JavaScript и запросов 5xx","Данные телефона отображаются в разделе учета и безопасности"]};
const key="stroycontrol-mvp-checklist-v1",saved=JSON.parse(localStorage.getItem(key)||"{}");let n=0;const root=document.querySelector("#checks");Object.entries(groups).forEach(([title,items])=>{const s=document.createElement("section");s.innerHTML=`<h2>${title}</h2>`;items.forEach(text=>{const id=`c${n++}`,l=document.createElement("label");l.innerHTML=`<input type="checkbox" id="${id}"><span>${text}</span>`;s.append(l)});root.append(s)});const fields=[...document.querySelectorAll("input,select,textarea")];fields.forEach(el=>{if(saved[el.id]!==undefined)el.type==="checkbox"?el.checked=saved[el.id]:el.value=saved[el.id];el.addEventListener("input",save)});function save(){const state={};fields.forEach(el=>state[el.id]=el.type==="checkbox"?el.checked:el.value);localStorage.setItem(key,JSON.stringify(state));const done=document.querySelectorAll("input[type=checkbox]:checked").length,total=document.querySelectorAll("input[type=checkbox]").length;document.querySelector("#count").textContent=`${done} / ${total}`;document.querySelector("#bar").style.width=`${done/total*100}%`}document.querySelector("#reset").onclick=()=>{if(confirm("Сбросить все отметки?")){localStorage.removeItem(key);location.reload()}};save();
</script></body></html>
