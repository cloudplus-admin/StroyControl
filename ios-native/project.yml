name: Astroy
options:
  bundleIdPrefix: uz.cloudplus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  Astroy:
    type: application
    platform: iOS
    sources: [Astroy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.cloudplus.stroycontrol
        MARKETING_VERSION: 1.0.75
        CURRENT_PROJECT_VERSION: 88
        INFOPLIST_KEY_CFBundleDisplayName: "Астрой"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для фотоотчетов и сканирования QR"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Геолокация нужна для подтверждения нахождения на объекте"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Микрофон нужен для аудиокомментариев"
        GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets: [AstroyTests]
  AstroyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AstroyTests]
    dependencies:
      - target: Astroy
