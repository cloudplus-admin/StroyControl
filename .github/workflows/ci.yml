name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stroycontrol
          POSTGRES_PASSWORD: stroycontrol
          POSTGRES_DB: stroycontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stroycontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stroycontrol:stroycontrol@localhost:5432/stroycontrol_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run lint --if-present
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npx vitest run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  mobile-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/app/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build debug APK
        working-directory: mobile/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stroycontrol-debug-apk
          path: mobile/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
